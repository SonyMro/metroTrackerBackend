services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: backend-postgis
    environment:
      POSTGRES_USER: user_metry
      POSTGRES_PASSWORD: erw34$23Ert
      POSTGRES_DB: dbmetry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_metry -d dbmetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: backend-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
